version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    allow:
      - dependency-type: all
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      # Keep model-affecting numerical updates separate and reviewable.
      numerical:
        patterns: [pandas, numpy, scipy, scikit-learn]
      pip:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      worker-security:
        applies-to: security-updates
        patterns: ["*"]
      worker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
