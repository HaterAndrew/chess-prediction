name: Daily Scrape & Update

on:
  schedule:
    - cron: '15 1 * * *'   # 2015 EST (UTC-5)
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run scraper
        id: scrape
        # chessaction.com 403s GitHub's IP ranges, so route the tournament-list
        # fetch through the Cloudflare Worker proxy (a non-blocked egress).
        # CCA_PROXY_URL is a repo variable; CCA_PROXY_KEY is a repo secret.
        # v5 Cat T: continue-on-error so a scrape outage degrades gracefully —
        # the predict step gets --scrape-failed, stamps the data stale, and the
        # site says so. Before this, a scrape failure killed the job here and
        # the degraded-banner step no-oped (pipeline_degraded never set), so
        # the site silently served day-old numbers as current.
        continue-on-error: true
        env:
          CCA_PROXY_URL: ${{ vars.CCA_PROXY_URL }}
          CCA_PROXY_KEY: ${{ secrets.CCA_PROXY_KEY }}
        run: |
          cd $GITHUB_WORKSPACE
          python scrape_entries.py

      - name: Update predictions
        id: predict
        run: |
          cd $GITHUB_WORKSPACE
          python auto_update.py --skip-scrape ${{ steps.scrape.outcome == 'failure' && '--scrape-failed' || '' }}

      # Quality gate (G1): a lint or test failure fails the job, and because the
      # commit step below is `if: success()`, a bad run is never committed/pushed
      # to the Pages branch. Runs after predict so output-reading tests see fresh data.
      - name: Test + lint gate
        id: gate
        run: |
          cd $GITHUB_WORKSPACE
          ruff check .
          pytest tests/ -q

      - name: Commit and push changes
        id: commit
        # H8: explicit success() guard (was emergent from an absent clause). This
        # is load-bearing — the gate above must be able to block the commit.
        if: success()
        run: |
          git config user.name "CCA Bot"
          git config user.email "bot@users.noreply.github.com"
          # docs/data/site_data.js carries the embedded data since the L15
          # externalization — the build writes it, so it MUST be committed or the
          # deployed data goes stale. output/data_health.json + audit/data-health
          # persist the freshness scan (H1) instead of expiring with the run log.
          git add output/daily_scrape.csv output/website_data.json output/daily_puzzles.json output/performance_data.json docs/index.html docs/sw.js docs/data/site_data.js docs/data/website_data.json docs/audit_warnings.json output/historical_tournaments.csv output/historical_standings.csv output/tournament_fees.csv output/tournament_metadata.csv output/walk_in_family_stats.csv output/walk_in_multipliers.csv output/tournament_summary.csv output/daily_registration_counts.csv output/update_log.csv output/checksums.json output/audit_warnings.json output/data_health.json output/scrape_health.json
          git add audit/data-health/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Daily update: $(date +%Y-%m-%d)"
          git pull --rebase || git pull --no-rebase
          git push

      # v3 O1 (audit/AUDIT_2026-07-25.md): the commit step above is `if: success()`,
      # so on a mid-run failure the degraded flag auto_update.py just stamped never
      # reached the Pages branch and the site kept serving day-old numbers as
      # current. Publish the staleness marker — and ONLY the staleness marker — on
      # failure. Every other output is discarded first, because a run that died
      # partway may have left a half-regenerated model file on disk; last-known-good
      # data behind an honest banner beats fresh-looking garbage.
      - name: Publish degraded-state banner on failure
        if: failure()
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "CCA Bot"
          git config user.email "bot@users.noreply.github.com"
          # Discard any partial regeneration, keeping only the flag fields.
          python3 - <<'PY'
          import json, subprocess, sys
          WD = "output/website_data.json"
          try:
              with open(WD) as fh:
                  degraded = json.load(fh)
          except Exception:
              sys.exit(0)
          if not degraded.get("pipeline_degraded"):
              sys.exit(0)
          flags = {k: degraded.get(k) for k in
                   ("is_stale", "pipeline_degraded", "degraded_reason", "degraded_at")}
          subprocess.run(["git", "checkout", "--", "output/", "docs/"], check=False)
          with open(WD) as fh:
              restored = json.load(fh)
          restored.update(flags)
          with open(WD, "w") as fh:
              json.dump(restored, fh, indent=2)
          print("Restored last-known-good data and re-applied degraded flags")
          PY
          python3 -c "import auto_update; auto_update.step_update_html()"
          git add output/website_data.json docs/data/site_data.js docs/index.html
          git diff --cached --quiet || git commit -m "Pipeline degraded: mark data stale ($(date +%Y-%m-%d))"
          git pull --rebase || git pull --no-rebase
          git push

      - name: Pipeline summary
        if: always()
        run: |
          echo "## Daily Scrape & Update — $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Scrape entries | ${{ steps.scrape.outcome || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Update predictions | ${{ steps.predict.outcome || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit & push | ${{ steps.commit.outcome || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f output/daily_scrape.csv ]; then
            ROWS=$(wc -l < output/daily_scrape.csv)
            echo "**Scrape output**: $((ROWS - 1)) tournament entries" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/website_data.json ]; then
            echo "**Predictions**: website_data.json updated" >> $GITHUB_STEP_SUMMARY
          fi
          # AUDIT.md follow-up #2: surface pipeline warnings in step summary.
          # auto_update.py harvests every WARNING: line from sub-steps into
          # output/audit_warnings.json. Display them here so they don't rot
          # in auto_update.log.
          if [ -f output/audit_warnings.json ]; then
            COUNT=$(python3 -c "import json; print(json.load(open('output/audit_warnings.json'))['count'])")
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$COUNT" = "0" ]; then
              echo "**Pipeline warnings**: 0 (clean run)" >> $GITHUB_STEP_SUMMARY
            else
              # v5 Cat V: warnings arrive deduped with per-entry counts —
              # one row per distinct warning instead of 200+ duplicates.
              echo "### Pipeline warnings ($COUNT distinct)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Step | Warning | n |" >> $GITHUB_STEP_SUMMARY
              echo "|------|---------|---|" >> $GITHUB_STEP_SUMMARY
              python3 -c 'import json; d=json.load(open("output/audit_warnings.json")); [print("| " + w["step"].replace("|", "\\|") + " | " + w["text"][:200].replace("|", "\\|") + " | " + str(w.get("count", 1)) + " |") for w in d["warnings"]]' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Create failure issue
        # v5 Cat T: also fire when the scrape step failed under
        # continue-on-error — the job then "succeeds" in degraded mode, but a
        # persistent scrape outage still needs a tracking issue.
        if: failure() || steps.scrape.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // v3 O4: reuse the open pipeline issue instead of filing a new one
            // every night. Consecutive failures used to leave a trail of
            // separate issues (#12, #13, #14 all open at once), which buried the
            // signal that it was one ongoing outage rather than three faults.
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().split('T')[0];
            const open = await github.rest.issues.listForRepo({
              ...common, state: 'open', labels: 'pipeline', per_page: 10,
            });
            const body = `Run ${context.runNumber} failed on ${today}.\n\n- **Workflow**: ${context.workflow}\n- **URL**: ${runUrl}\n- **Triggered**: ${context.eventName}`;
            if (open.data.length > 0) {
              const issue = open.data[0];
              await github.rest.issues.createComment({
                ...common, issue_number: issue.number,
                body: `Still failing.\n\n${body}`,
              });
              core.info(`Commented on existing pipeline issue #${issue.number}`);
            } else {
              await github.rest.issues.create({
                ...common,
                title: `Pipeline failure: ${context.workflow} — ${today}`,
                body: `## Pipeline Failure\n\n${body}\n\nThis issue stays open and collects a comment per consecutive failure. It closes automatically on the next successful run.`,
                labels: ['bug', 'pipeline'],
              });
              core.info('Opened a new pipeline issue');
            }

      # v3 O4: close the loop. Without this the failure issues never resolved,
      # so an open 'pipeline' issue said nothing about current health.
      # v5 Cat T: a degraded run (scrape failed under continue-on-error) is
      # NOT a recovery — don't close the issue the previous step just fed.
      - name: Close pipeline issues on recovery
        if: success() && steps.scrape.outcome != 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            const open = await github.rest.issues.listForRepo({
              ...common, state: 'open', labels: 'pipeline', per_page: 20,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                ...common, issue_number: issue.number,
                body: `Recovered: run ${context.runNumber} completed successfully on ${new Date().toISOString().split('T')[0]}.`,
              });
              await github.rest.issues.update({
                ...common, issue_number: issue.number, state: 'closed',
              });
              core.info(`Closed pipeline issue #${issue.number}`);
            }
