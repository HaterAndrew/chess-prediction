name: Daily Scrape & Update

on:
  schedule:
    - cron: '15 1 * * *'   # 2015 EST (UTC-5)
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy scipy scikit-learn zstandard requests beautifulsoup4

      - name: Run scraper
        id: scrape
        run: |
          cd $GITHUB_WORKSPACE
          python scrape_entries.py

      - name: Update predictions
        id: predict
        run: |
          cd $GITHUB_WORKSPACE
          python auto_update.py --skip-scrape

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "CCA Bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/daily_scrape.csv output/website_data.json output/daily_puzzles.json output/performance_data.json docs/index.html docs/website_data.json docs/audit_warnings.json output/historical_tournaments.csv output/historical_standings.csv output/tournament_fees.csv output/tournament_metadata.csv output/walk_in_family_stats.csv output/walk_in_multipliers.csv output/tournament_summary.csv output/daily_registration_counts.csv output/update_log.csv output/checksums.json output/audit_warnings.json
          git diff --cached --quiet || git commit -m "Daily update: $(date +%Y-%m-%d)"
          git pull --rebase || git pull --no-rebase
          git push

      - name: Pipeline summary
        if: always()
        run: |
          echo "## Daily Scrape & Update — $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Scrape entries | ${{ steps.scrape.outcome || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Update predictions | ${{ steps.predict.outcome || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit & push | ${{ steps.commit.outcome || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f output/daily_scrape.csv ]; then
            ROWS=$(wc -l < output/daily_scrape.csv)
            echo "**Scrape output**: $((ROWS - 1)) tournament entries" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/website_data.json ]; then
            echo "**Predictions**: website_data.json updated" >> $GITHUB_STEP_SUMMARY
          fi
          # AUDIT.md follow-up #2: surface pipeline warnings in step summary.
          # auto_update.py harvests every WARNING: line from sub-steps into
          # output/audit_warnings.json. Display them here so they don't rot
          # in auto_update.log.
          if [ -f output/audit_warnings.json ]; then
            COUNT=$(python3 -c "import json; print(json.load(open('output/audit_warnings.json'))['count'])")
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$COUNT" = "0" ]; then
              echo "**Pipeline warnings**: 0 (clean run)" >> $GITHUB_STEP_SUMMARY
            else
              echo "### Pipeline warnings ($COUNT)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Step | Warning |" >> $GITHUB_STEP_SUMMARY
              echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
              python3 -c 'import json; d=json.load(open("output/audit_warnings.json")); [print("| " + w["step"].replace("|", "\\|") + " | " + w["text"][:200].replace("|", "\\|") + " |") for w in d["warnings"]]' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failure: ${context.workflow} — ${new Date().toISOString().split('T')[0]}`,
              body: `## Pipeline Failure\n\n- **Workflow**: ${context.workflow}\n- **Run**: ${context.runNumber}\n- **URL**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- **Triggered**: ${context.eventName}\n\nPlease investigate.`,
              labels: ['bug', 'pipeline']
            });
