name: Weekly Enrichment Scrapers

on:
  schedule:
    - cron: '0 12 * * 1'   # Every Monday at 12:00 UTC (8:00 AM ET)
  workflow_dispatch:
    inputs:
      scraper:
        description: 'Which scraper to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - fees
          - standings
          - historical

permissions:
  contents: write
  issues: write

jobs:
  enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run enrichment scrapers (warnings persisted)
        id: enrichment
        # H4: route the scrapers through run_enrichment.py so each one's WARNING:
        # lines are harvested into output/audit_warnings.json (+ docs/) instead of
        # expiring with this Actions log. Output still streams live here. The
        # scraper arg preserves manual-dispatch granularity; scheduled runs do all.
        run: PYTHONUNBUFFERED=1 python run_enrichment.py "${{ github.event.inputs.scraper || 'all' }}"
        timeout-minutes: 90

      # Quality gate (G1): shared code is tested before enrichment data is committed.
      - name: Test + lint gate
        id: gate
        run: |
          ruff check .
          pytest tests/ -q

      - name: Commit and push enrichment data
        id: commit
        if: success()
        run: |
          git config user.name "CCA Bot"
          git config user.email "bot@users.noreply.github.com"
          # v5 Cat F: tournament_metadata.csv is the file merge_fees WRITES —
          # without it in the add list, every successful weekly fee merge
          # evaporated with the runner (the daily workflow commits the file
          # but never runs the merge).
          git add output/tournament_fees.csv output/historical_standings.csv output/historical_tournaments.csv output/tournament_metadata.csv output/audit_warnings.json docs/audit_warnings.json
          git diff --cached --quiet || git commit -m "Enrichment data update: $(date +%Y-%m-%d)"
          git pull --rebase || git pull --no-rebase
          git push

      - name: Pipeline summary
        if: always()
        run: |
          echo "## Weekly Enrichment Scrapers — $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Enrichment scrapers | ${{ steps.enrichment.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit & push | ${{ steps.commit.outcome || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f output/audit_warnings.json ]; then
            WARN=$(python -c "import json;print(json.load(open('output/audit_warnings.json')).get('count',0))" 2>/dev/null || echo '?')
            echo "**Pipeline warnings captured**: $WARN" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in output/tournament_fees.csv output/historical_standings.csv output/historical_tournaments.csv; do
            if [ -f "$f" ]; then
              ROWS=$(wc -l < "$f")
              echo "**$(basename $f)**: $((ROWS - 1)) rows" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failure: ${context.workflow} — ${new Date().toISOString().split('T')[0]}`,
              body: `## Pipeline Failure\n\n- **Workflow**: ${context.workflow}\n- **Run**: ${context.runNumber}\n- **URL**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- **Triggered**: ${context.eventName}\n\nPlease investigate.`,
              labels: ['bug', 'pipeline']
            });
