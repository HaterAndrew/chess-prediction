name: Weekly Enrichment Scrapers

on:
  schedule:
    - cron: '0 12 * * 1'   # Every Monday at 12:00 UTC (8:00 AM ET)
  workflow_dispatch:
    inputs:
      scraper:
        description: 'Which scraper to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - fees
          - standings
          - historical

permissions:
  contents: write
  issues: write

jobs:
  enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas numpy

      - name: Run fee scraper
        id: fees
        if: >
          github.event_name == 'schedule' ||
          github.event.inputs.scraper == 'fees' ||
          github.event.inputs.scraper == 'all'
        run: PYTHONUNBUFFERED=1 python scrape_fees.py

      - name: Run standings scraper
        id: standings
        if: >
          github.event_name == 'schedule' ||
          github.event.inputs.scraper == 'standings' ||
          github.event.inputs.scraper == 'all'
        run: PYTHONUNBUFFERED=1 python scrape_standings.py
        timeout-minutes: 60

      - name: Run historical scraper
        id: historical
        if: >
          github.event_name == 'schedule' ||
          github.event.inputs.scraper == 'historical' ||
          github.event.inputs.scraper == 'all'
        run: PYTHONUNBUFFERED=1 python scrape_historical.py
        timeout-minutes: 30

      - name: Commit and push enrichment data
        id: commit
        run: |
          git config user.name "CCA Bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/tournament_fees.csv output/historical_standings.csv output/historical_tournaments.csv
          git diff --cached --quiet || git commit -m "Enrichment data update: $(date +%Y-%m-%d)"
          git pull --rebase || git pull --no-rebase
          git push

      - name: Pipeline summary
        if: always()
        run: |
          echo "## Weekly Enrichment Scrapers — $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scraper | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Fee scraper | ${{ steps.fees.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Standings scraper | ${{ steps.standings.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Historical scraper | ${{ steps.historical.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit & push | ${{ steps.commit.outcome || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in output/tournament_fees.csv output/historical_standings.csv output/historical_tournaments.csv; do
            if [ -f "$f" ]; then
              ROWS=$(wc -l < "$f")
              echo "**$(basename $f)**: $((ROWS - 1)) rows" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failure: ${context.workflow} — ${new Date().toISOString().split('T')[0]}`,
              body: `## Pipeline Failure\n\n- **Workflow**: ${context.workflow}\n- **Run**: ${context.runNumber}\n- **URL**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- **Triggered**: ${context.eventName}\n\nPlease investigate.`,
              labels: ['bug', 'pipeline']
            });
