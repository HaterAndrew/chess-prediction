# PR gate for the Python side. Exists because the 2026-07-31 nightly outage
# was a dependabot pip bump (numpy 2.5 dropped Python 3.11) merged with no CI
# at all on pip PRs — the nightly was the first thing to run the new pins.
# This mirrors the nightly's own env and gate (same pinned action SHAs, same
# interpreter, same install, same ruff+pytest) so a requirements bump that
# would break the nightly shows a red X on the PR instead.
name: Python CI

on:
  pull_request:
    paths:
      # Setup-action updates must exercise the same gate as runtime changes.
      - '.github/**'
      - '.node-version'
      - '.mise.toml'
      - 'requirements*.txt'
      - 'requirements*.in'
      - 'pyproject.toml'
      - '**/*.py'
      # The Node-driven suites (service worker, util_core, daily
      # series) and the markup gates read docs/; a front-end-only PR must
      # run them too.
      - 'docs/**'
      - 'tests/js/**'
      # A hand edit to a data file must regenerate checksums.json.
      - 'output/**'
  workflow_dispatch:
  # Fresh advisories must surface even when no dependency PR is open.
  schedule:
    - cron: '45 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node for the JavaScript regression tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Audit runtime, development and optional dependency locks
        run: pip-audit --disable-pip -r requirements.txt -r requirements-dev.txt -r requirements-optional.txt

      - name: Audit GitHub Actions
        run: zizmor .github
        env:
          GH_TOKEN: ${{ github.token }}

      # The committed manifest must match the committed CSVs. Runs on the fresh
      # checkout, before the tests can write anything to output/.
      - name: Verify output checksums
        run: python verify_checksums.py verify

      - name: Lint + test (the nightly's own gate)
        run: |
          ruff check .
          pytest tests/ -q
