# v4 X2 (audit/AUDIT_2026-07-26.md): the Cloudflare Worker holds the Anthropic
# key and previously shipped with no gate at all — a type error reached
# `wrangler deploy` with nothing catching it. Deploy stays manual
# (`npm run deploy` in worker/), but every worker change now has to pass
# typecheck first.
name: Worker CI

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker_ci.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker_ci.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
