# v4 X2 (audit/AUDIT_2026-07-26.md): the Cloudflare Worker holds the Anthropic
# key and previously shipped with no gate at all — a type error reached
# `wrangler deploy` with nothing catching it. Workers Builds deploys main,
# so every Worker change must pass the checks before merging.
name: Worker CI

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker_ci.yml'
      - '.node-version'
      - '.mise.toml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker_ci.yml'
      - '.node-version'
      - '.mise.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # Corepack uses the hashed packageManager pin for current provenance support.
      # Native binaries resolve from platform packages without install scripts.
      - run: corepack npm ci --ignore-scripts
      - run: corepack npm audit --audit-level=moderate
      - run: corepack npm audit signatures --json
      - run: corepack npm run typecheck
      - run: corepack npm test
      # Validates wrangler.toml and the asset manifest under ../docs without
      # credentials or an upload; Workers Builds runs the real deploy on main.
      - run: corepack npm exec -- wrangler deploy --dry-run
