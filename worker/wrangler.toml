name = "chess-ask"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# CORS allowlist origin (set this to the deployed site).
# The Worker uses this to set Access-Control-Allow-Origin.
[vars]
ALLOWED_ORIGIN = "https://haterandrew.github.io,http://localhost:8080,http://127.0.0.1:8080"
DATA_URL = "https://haterandrew.github.io/chess-prediction/website_data.json"
MODEL = "claude-sonnet-4-6"
DAILY_BUDGET_USD = "1.00"
RATE_LIMIT_PER_MIN = "20"

# KV namespace: rate-limit buckets + daily-cost counter
[[kv_namespaces]]
binding = "KV"
id = "3a7c98e0906c4d9eb355647a5a77feb7"

# Secret (set via `wrangler secret put ANTHROPIC_API_KEY`):
#   ANTHROPIC_API_KEY
